<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Particles</title>

    <style>
      canvas {
        display: block;
        border-radius: 20px;
        background: #0f1219;
        width: min(96vw, 96vh);
        height: min(96vw, 96vh);
        max-width: 800px;
        max-height: 800px;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <canvas id="particleCanvas" width="800" height="800"></canvas>
    <script>
      (function () {
        const canvas = document.getElementById("particleCanvas");

        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;

        const context = canvas.getContext("2d");

        const gravity = 0;

        const rand = (min, max) => Math.random() * (max - min) + min;

        let particles = [];

        let mouseX;
        let mouseY;
        let mouseX2;
        let mouseY2;
        let mouseVX;
        let mouseVY;

        canvas.addEventListener("mousemove", (e) => {
          mouseX2 = mouseX;
          mouseY2 = mouseY;

          mouseX = e.offsetX;
          mouseY = e.offsetY;

          mouseVX = mouseX - mouseX2;
          mouseVY = mouseY - mouseY2;
        });
        function spawnParticle() {
          // const x = canvas.width / 2 + rand(-45, 45);
          // const y = rand(canvas.height, canvas.height - 50);

          const x = mouseX;
          const y = mouseY;

          const radius = rand(0.5, 20);

          const vx = rand(-1, 1) + mouseVX / 5;
          const vy = rand(-1, 1) + mouseVY / 5;

          const hue = rand(330, 360);
          const sat = rand(80, 100);
          const light =
            rand(35, 55) +
            Math.sqrt(Math.abs(mouseVX) ^ (2 + Math.abs(mouseVX)) ^ 2) * 7;

          const lifetime = rand(70, 100);

          particles.push({
            x,
            y,
            vx,
            vy,
            radius,
            hue,
            sat,
            light,
            life: lifetime,
            maxLife: lifetime,
          });
        }

        function updateParticles() {
          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];

            p.vy += gravity;

            p.x += p.vx;
            p.y += p.vy;

            p.vx *= 0.95; // Drag
            p.vy *= 0.95;

            p.radius -= p.radius / 50;

            p.life--;

            if (p.life <= 0) {
              particles.splice(i, 1);
            }
          }
        }

        function draw() {
          context.clearRect(0, 0, canvas.width, canvas.height);

          for (const p of particles) {
            const color = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, 0.8)`;
            context.beginPath();
            context.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            context.fillStyle = color;
            context.fill();
          }
        }

        function loop() {
          for (let s = 0; s < 24; s++) {
            if (particles.length < 5000) {
              spawnParticle();
            } else {
              break;
            }
          }

          updateParticles();

          draw();

          requestAnimationFrame(loop);
        }

        loop();
      })();
    </script>
  </body>
</html>
